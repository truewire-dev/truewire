name: CI

# The fast gate only: lint and the Python unit tests. Everything heavier (the examples in four
# languages, the Go, TypeScript and Rust runtimes, the clients) runs on the team's VM as the
# `truewire/verify` commit status, which merges require.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python -e packages/core-python[dev] -e 'packages/truewire[dev]'
      - name: Lint
        run: .venv/bin/ruff check --config packages/truewire/src/truewire/resources/ruff.toml packages/truewire/src/truewire/cli packages/truewire/src/truewire/score packages/truewire/src/truewire/project.py packages/truewire/src/truewire/openapi.py packages/core-python/src
      - name: Runtime tests
        run: .venv/bin/python -m pytest packages/core-python/test -q
      - name: Toolchain tests
        run: .venv/bin/python -m pytest packages/truewire/test -q
