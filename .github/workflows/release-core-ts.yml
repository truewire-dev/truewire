name: Release @truewire/core

# Merge a pull request from branch `release/core-ts` into main. If the version in
# packages/core-ts/package.json is not on npm yet, this builds, publishes through npm
# trusted publishing (which mints its own short-lived credential from this job's OIDC
# token and attests provenance), tags `core-ts-v<version>` and creates the GitHub release.
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths: ['packages/core-ts/**']

permissions:
  id-token: write
  contents: write

jobs:
  check:
    if: github.event.pull_request.merged == true && github.head_ref == 'release/core-ts'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        run: |
          version=$(node -p "require('./packages/core-ts/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: check
        run: |
          # `npm view` prints the version when it exists; it prints nothing (or fails
          # with 404 while the package has never been published) when it does not.
          if found=$(npm view "@truewire/core@${{ steps.version.outputs.version }}" version 2>/dev/null) && [ -n "$found" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.published == 'false'
    runs-on: ubuntu-latest
    # The npm token lives on this environment rather than loose in the repository's
    # secrets, so it is reachable from this one job and can be gated on top of that.
    environment: npm
    defaults:
      run:
        working-directory: packages/core-ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: yarn
          cache-dependency-path: packages/core-ts/yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Test
        run: |
          yarn typecheck
          yarn test
      - name: Build
        run: yarn build
      - name: Package contents match package.json
        # Every file `exports`, `main` and `types` point at must exist in dist/ and be
        # inside the `files` list, so a consumer resolves what the manifest promises.
        run: |
          node --input-type=module - <<'EOF'
          import { existsSync } from 'node:fs'
          import { readFile } from 'node:fs/promises'
          import { execFileSync } from 'node:child_process'
          const pkg = JSON.parse(await readFile('package.json', 'utf8'))
          const targets = new Set([pkg.main, pkg.types].filter(Boolean))
          const walk = (v) => typeof v === 'string' ? targets.add(v) : Object.values(v).forEach(walk)
          walk(pkg.exports)
          const packed = JSON.parse(execFileSync('npm', ['pack', '--dry-run', '--json', '--ignore-scripts'], { encoding: 'utf8' }))
          const shipped = new Set(packed[0].files.map((f) => f.path))
          const missing = [...targets].filter((t) => !existsSync(t))
          const unshipped = [...targets].filter((t) => !shipped.has(t.replace(/^\.\//, '')))
          if (missing.length || unshipped.length) {
            console.error('not built:', missing, '\nnot in the tarball:', unshipped)
            process.exit(1)
          }
          console.log(`${shipped.size} files in the tarball; every entry point is present`)
          EOF
      - name: Publish
        # Trusted publishing: npm mints a short-lived credential from this job's OIDC token
        # (`id-token: write`, above), so there is no npm token anywhere -- nothing to leak,
        # nothing to rotate, and nothing to revoke by hand. It requires npm 11.5.1 or newer,
        # which the version bundled with Node 22 is not, and it publishes provenance by
        # itself, so `--provenance` is not passed.
        #
        # npm prefers a token when `NODE_AUTH_TOKEN` is set, so this step deliberately sets
        # none: a leftover `NPM_TOKEN` secret would silently take precedence and put us back
        # where we started.
        run: |
          npm install -g npm@latest
          npm --version
          npm publish --access public
      - id: previous_tag
        run: |
          previous=$(git tag -l 'core-ts-v*' | sort -V | tail -1)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - run: git tag core-ts-v${{ needs.check.outputs.version }}
      - run: git push origin core-ts-v${{ needs.check.outputs.version }}
      - if: steps.previous_tag.outputs.previous != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core-ts-v${{ needs.check.outputs.version }}
          name: "@truewire/core ${{ needs.check.outputs.version }}"
          previous_tag: ${{ steps.previous_tag.outputs.previous }}
          generate_release_notes: true
          body: |
            Published to [npm](https://www.npmjs.com/package/@truewire/core/v/${{ needs.check.outputs.version }}) as `@truewire/core@${{ needs.check.outputs.version }}`.

            ${{ github.event.pull_request.body }}
      - if: steps.previous_tag.outputs.previous == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core-ts-v${{ needs.check.outputs.version }}
          name: "@truewire/core ${{ needs.check.outputs.version }}"
          generate_release_notes: true
          body: |
            Published to [npm](https://www.npmjs.com/package/@truewire/core/v/${{ needs.check.outputs.version }}) as `@truewire/core@${{ needs.check.outputs.version }}`.

            ${{ github.event.pull_request.body }}
