name: Release truewire (crates.io)

# Manual: publishes crates/truewire at the version in its Cargo.toml. Uses the
# CARGO_REGISTRY_TOKEN repository secret for the first publish; once the crate exists,
# configure Trusted Publishing on crates.io for this workflow and drop the secret.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Skip if this version is already published
        id: check
        run: |
          version=$(grep -m1 '^version = ' crates/truewire/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/truewire/$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.check.outputs.published == 'false'
        working-directory: crates/truewire
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty
