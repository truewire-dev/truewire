name: Release a crate (crates.io)

# Manual: publishes one crate under `crates/` at the version in its own Cargo.toml,
# skipping a version already on crates.io so a re-run is a no-op rather than an error.
#
# Authentication tries Trusted Publishing (OIDC) first and falls back to the
# `CARGO_REGISTRY_TOKEN` secret on the `crates-io` environment.
#
# That order, and not the other one, because a stale or narrowly scoped token must not be
# able to shadow a working publisher: 0.1.1 of `truewire-core` failed with `403 this token
# does not have the required permissions` while a perfectly good trusted publisher sat
# unused behind it. Preferring the token is the same trap npm has, where a leftover
# `NODE_AUTH_TOKEN` silently wins over OIDC.
#
# The token is still needed for a crate's *first* publish: crates.io Trusted Publishing can
# only publish a crate that already exists, having no pending-publisher concept as PyPI
# does. The auth step is `continue-on-error` for exactly that case -- no publisher yet
# means no token minted, and the secret takes over. So the secret can be deleted once every
# crate has shipped once, and until then it does no harm sitting there.
#
# Trusted publisher settings, per crate: owner `truewire-dev`, repository `truewire`,
# workflow `release-crate.yml`, environment `crates-io`.
on:
  workflow_dispatch:
    inputs:
      crate:
        description: Which crate under crates/ to publish.
        type: choice
        required: true
        default: truewire-core
        options:
          - truewire-core
          - truewire

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Skip if this version is already published
        id: check
        run: |
          version=$(grep -m1 '^version = ' "crates/${{ inputs.crate }}/Cargo.toml" | sed -E 's/version = "(.*)"/\1/')
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/${{ inputs.crate }}/$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "publishing ${{ inputs.crate }} $version (already published: $([ "$code" = "200" ] && echo yes || echo no))"
      - name: Build and test before publishing
        # A crate on crates.io cannot be unpublished, only yanked, so the gates run here
        # rather than on trust that they ran somewhere earlier.
        if: steps.check.outputs.published == 'false'
        working-directory: crates/${{ inputs.crate }}
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo build
          cargo test
      - name: Trusted Publishing token
        # Tried first, and allowed to fail: the action errors when the crate has no
        # trusted publisher configured, which is every crate's first publish and is
        # exactly when the token is meant to take over.
        if: steps.check.outputs.published == 'false'
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1
      - name: Which credential
        id: creds
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${{ steps.auth.outputs.token }}" ]; then
            echo "using=trusted publishing" >> "$GITHUB_OUTPUT"
          elif [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "using=the CARGO_REGISTRY_TOKEN secret" >> "$GITHUB_OUTPUT"
          else
            echo "using=nothing" >> "$GITHUB_OUTPUT"
          fi
          echo "publishing with ${{ steps.auth.outputs.token && 'trusted publishing' || 'the token' }}"
      - name: Publish
        if: steps.check.outputs.published == 'false'
        working-directory: crates/${{ inputs.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty
      - name: Summary
        run: |
          echo "### ${{ inputs.crate }} ${{ steps.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.published }}" = "true" ]; then
            echo "Already on crates.io; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published to [crates.io](https://crates.io/crates/${{ inputs.crate }}) with ${{ steps.creds.outputs.using }}." >> "$GITHUB_STEP_SUMMARY"
          fi
