name: Release a crate (crates.io)

# Manual: publishes one crate under `crates/` at the version in its own Cargo.toml,
# skipping a version already on crates.io so a re-run is a no-op rather than an error.
#
# Authentication takes whichever of the two is available, in that order:
#
# 1. `CARGO_REGISTRY_TOKEN` on the `crates-io` environment. Needed for a crate's *first*
#    publish, because crates.io Trusted Publishing can only publish a crate that already
#    exists -- unlike PyPI, it has no pending-publisher concept.
# 2. Trusted Publishing (OIDC), once the crate exists and a publisher is configured: owner
#    `truewire-dev`, repository `truewire`, workflow `release-crate.yml`, environment
#    `crates-io`.
#
# So the token can be removed the moment every crate here has been published once.
on:
  workflow_dispatch:
    inputs:
      crate:
        description: Which crate under crates/ to publish.
        type: choice
        required: true
        default: truewire-core
        options:
          - truewire-core
          - truewire

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Skip if this version is already published
        id: check
        run: |
          version=$(grep -m1 '^version = ' "crates/${{ inputs.crate }}/Cargo.toml" | sed -E 's/version = "(.*)"/\1/')
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/${{ inputs.crate }}/$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "publishing ${{ inputs.crate }} $version (already published: $([ "$code" = "200" ] && echo yes || echo no))"
      - name: Build and test before publishing
        # A crate on crates.io cannot be unpublished, only yanked, so the gates run here
        # rather than on trust that they ran somewhere earlier.
        if: steps.check.outputs.published == 'false'
        working-directory: crates/${{ inputs.crate }}
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo build
          cargo test
      - name: Is a registry token configured?
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: echo "present=$([ -n "$CARGO_REGISTRY_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Trusted Publishing token
        if: steps.check.outputs.published == 'false' && steps.token.outputs.present == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        if: steps.check.outputs.published == 'false'
        working-directory: crates/${{ inputs.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --allow-dirty
      - name: Summary
        run: |
          echo "### ${{ inputs.crate }} ${{ steps.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.published }}" = "true" ]; then
            echo "Already on crates.io; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published to [crates.io](https://crates.io/crates/${{ inputs.crate }})." >> "$GITHUB_STEP_SUMMARY"
          fi
