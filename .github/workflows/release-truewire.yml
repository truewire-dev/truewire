name: Release truewire

# Merge a pull request from branch `release/truewire` into main. If the version in
# packages/truewire/pyproject.toml is not on PyPI yet, this builds, publishes
# (PyPI Trusted Publishing; the pending publisher names this workflow file),
# tags `truewire-v<version>` and creates the GitHub release.
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths: ['packages/truewire/**']

permissions:
  id-token: write
  contents: write

jobs:
  check:
    if: github.event.pull_request.merged == true && github.head_ref == 'release/truewire'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: version
        run: |
          version=$(grep -m1 '^version = ' packages/truewire/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/truewire/${{ steps.version.outputs.version }}/json")
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.published == 'false'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v4
      - name: Test
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e 'packages/core-python[dev]' -e 'packages/truewire[dev]'
          .venv/bin/ruff check --config packages/truewire/src/truewire/resources/ruff.toml packages/truewire/src/truewire/cli packages/truewire/src/truewire/project.py packages/truewire/src/truewire/openapi.py
          .venv/bin/python -m pytest packages/truewire/test -q
      - name: Build
        run: uv build packages/truewire --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - id: previous_tag
        run: |
          previous=$(git tag -l 'truewire-v*' | sort -V | tail -1)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - run: git tag truewire-v${{ needs.check.outputs.version }}
      - run: git push origin truewire-v${{ needs.check.outputs.version }}
      - if: steps.previous_tag.outputs.previous != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: truewire-v${{ needs.check.outputs.version }}
          name: truewire ${{ needs.check.outputs.version }}
          previous_tag: ${{ steps.previous_tag.outputs.previous }}
          generate_release_notes: true
          body: |
            Published to [PyPI](https://pypi.org/project/truewire/${{ needs.check.outputs.version }}/) as `truewire==${{ needs.check.outputs.version }}`.

            ${{ github.event.pull_request.body }}
      - if: steps.previous_tag.outputs.previous == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: truewire-v${{ needs.check.outputs.version }}
          name: truewire ${{ needs.check.outputs.version }}
          generate_release_notes: true
          body: |
            Published to [PyPI](https://pypi.org/project/truewire/${{ needs.check.outputs.version }}/) as `truewire==${{ needs.check.outputs.version }}`.

            ${{ github.event.pull_request.body }}
