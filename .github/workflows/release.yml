name: Release

on:
  push:
    tags: ['truewire-core-v*', 'truewire-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (OIDC); no token stored anywhere
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Pick the package from the tag
        id: pick
        run: |
          case "${GITHUB_REF_NAME}" in
            truewire-core-v*) echo "dir=packages/core-python" >> "$GITHUB_OUTPUT" ;;
            truewire-v*) echo "dir=packages/truewire" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build
        run: uv build "${{ steps.pick.outputs.dir }}" --out-dir dist
      - name: Publish
        run: uv publish --trusted-publishing always dist/*
