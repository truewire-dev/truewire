[package]
name = "truewire-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "The runtime behind Rust clients generated by Truewire: typed, validated, true to the wire."
license = "MIT"
repository = "https://github.com/truewire-dev/truewire"
homepage = "https://truewire.dev"
readme = "README.md"
keywords = ["api", "client", "codegen", "websocket"]
categories = ["api-bindings"]

[features]
default = ["rustls-tls"]
# TLS for HTTP and WebSocket. Exactly one is normally enabled; both may be.
rustls-tls = ["reqwest/rustls-tls", "tokio-tungstenite/rustls-tls-webpki-roots"]
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]

[dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
