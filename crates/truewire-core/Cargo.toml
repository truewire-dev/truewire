[package]
name = "truewire-core"
version = "0.2.0"
edition = "2021"
description = "The runtime behind Rust clients generated by Truewire: typed, validated, true to the wire."
license = "MIT"
repository = "https://github.com/truewire-dev/truewire"
homepage = "https://truewire.dev"
readme = "README.md"
keywords = ["api", "client", "codegen", "websocket"]
categories = ["api-bindings"]

[features]
default = ["rustls-tls"]
# TLS for HTTP and WebSocket. Exactly one is normally enabled; both may be.
rustls-tls = ["reqwest/rustls-tls", "tokio-tungstenite/rustls-tls-webpki-roots"]
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
# Protobuf messages as JSON values, from `.proto` sources (compiled in-process) or a
# serialized `FileDescriptorSet`: binary WebSocket frames, gRPC messages.
proto = ["dep:prost", "dep:prost-reflect", "dep:protox"]
# Unary gRPC calls over dynamic messages, TLS included. Implies `proto`.
grpc = ["proto", "dep:tonic", "dep:http"]

[dependencies]
async-trait = "0.1"
# The `Proxy-Authorization` of a WebSocket `CONNECT` (`Socket::with_proxy`).
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# `decimal-string` at any precision: a 33-digit volume is neither rounded nor refused.
bigdecimal = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: an object keeps its keys in the order a struct wrote them, so a dumped
# request travels in the spec's own property order, as the other runtimes send it.
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
url = "2"
percent-encoding = "2"
# `integer-string` holds any integer the wire does: wei amounts, uint256 token ids.
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-traits = "0.2"
http = { version = "1", optional = true }
prost = { version = "0.14", optional = true }
prost-reflect = { version = "0.16", features = ["serde"], optional = true }
protox = { version = "0.9", optional = true }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-webpki-roots"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["router"] }
tower = "0.5"

[[test]]
name = "proto"
required-features = ["proto"]

[[test]]
name = "grpc"
required-features = ["grpc"]
