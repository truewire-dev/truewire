[package]
name = "truewire-testing"
version = "0.1.0"
edition = "2021"
description = "Test helpers for Rust clients generated by Truewire: truewire mock as a child process, and replay of every recorded example."
license = "MIT"
repository = "https://github.com/truewire-dev/truewire"
homepage = "https://truewire.dev"
publish = false

[features]
# An in-process fake gRPC server answering recorded gRPC examples, and their replay (ADR 0017).
grpc = [
    "dep:truewire-core",
    "dep:axum",
    "dep:base64",
    "dep:futures",
    "dep:http",
    "dep:prost",
    "dep:prost-reflect",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tonic",
    "dep:tower-service",
]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }
futures = { version = "0.3", optional = true }
http = { version = "1", optional = true }
prost = { version = "0.14", optional = true }
prost-reflect = { version = "0.16", optional = true }
tokio = { version = "1", features = ["net", "rt", "sync"], optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "server"], optional = true }
tower-service = { version = "0.3", optional = true }
truewire-core = { path = "../truewire-core", default-features = false, features = ["grpc"], optional = true }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "grpc"
required-features = ["grpc"]
