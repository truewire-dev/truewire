$schema: https://truewire.dev/schemas/docs.yml.json
title: Kraken
description: A typed, validated client for Kraken Spot over REST and WebSocket v2.
nav:
  - index.md
  - api-keys.md
  - title: How-to
    pages:
      - how-to/index.md
      - how-to/dry-run-order.md
  - reference/index.md
quickstart:
  python:
    code: |
      import asyncio

      from kraken import Kraken


      async def main() -> None:
        async with Kraken.new(public=True) as client:
          ticker = await client.spot.market_data.ticker(pair='XBTUSD')
          for pair, snapshot in ticker.items():
            last = snapshot.get('c')
            if last is not None:
              print(pair, 'last trade', last[0])


      asyncio.run(main())
  typescript:
    code: |
      import { Kraken } from 'kraken'
      import { Core } from 'kraken/core'

      const core = new Core()
      const ticker = await new Kraken(core).spot.marketData.ticker({ pair: 'XBTUSD' })
      for (const [pair, snapshot] of Object.entries(ticker)) {
        console.log(pair, 'last trade', snapshot.c?.[0])
      }
      await core.close()
  rust:
    code: |
      use kraken::core::CoreOptions;
      use kraken::spot::market_data::ticker;
      use kraken::{CallOptions, Kraken};

      #[tokio::main]
      async fn main() -> Result<(), Box<dyn std::error::Error>> {
          let client = Kraken::new(CoreOptions::default());
          let request = ticker::Request {
              pair: Some("XBTUSD".into()),
              ..Default::default()
          };
          let tickers = client.spot.market_data.ticker(request, CallOptions::default()).await?;
          for (pair, snapshot) in &tickers {
              if let Some((price, _)) = &snapshot.c {
                  println!("{pair} last trade {price}");
              }
          }
          Ok(())
      }
  go:
    code: |
      package main

      import (
      	"context"
      	"fmt"
      	"log"

      	truewire "truewire.dev/core"

      	"truewire.dev/examples/kraken/src/kraken"
      	"truewire.dev/examples/kraken/src/kraken/core"
      	"truewire.dev/examples/kraken/src/kraken/spot/marketdata/ticker"
      )

      func main() {
      	client := kraken.New(core.New(core.Options{}))
      	tickers, err := client.Spot.MarketData.Ticker(context.Background(), ticker.Request{Pair: truewire.Ptr("XBTUSD")})
      	if err != nil {
      		log.Fatal(err)
      	}
      	for pair, snapshot := range tickers {
      		if snapshot.C != nil {
      			fmt.Println(pair, "last trade", snapshot.C.V0)
      		}
      	}
      }
