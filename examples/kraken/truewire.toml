#:schema https://truewire.dev/schemas/truewire.toml.json
[project]
name = "kraken"

# W15: the client refuses to move funds off the exchange. `spot.funding.withdraw` keeps its
# generated method in every backend, and that method fails with `RefusedByPolicy` before
# any request is made (Go does not render refusals yet, and `generate go` says so).
[policy]
refuse = ["spot.funding.withdraw"]

[cores.spot]
# `signed` genuinely varies across spot's own 58 endpoints (46 signed, 12 public) --
# design §2/§6. `socket` (streams.market_data, streams.private, trading_ws -- 17
# endpoints, all meta: {}) carries no schema: `SocketEndpoint` reads nothing from
# `meta` at all -- the private/public split there is a connection-level fact
# (`[python.cores]` `children` routing), not a per-call one.
meta = { type = "object", properties = { signed = { type = "boolean" } }, additionalProperties = false }

[python]
package = "kraken"
src = "src"
name = "Kraken"

[typescript]
package = "kraken"
src = "src"
name = "Kraken"

[go]
package = "kraken"
src = "src"
name = "Kraken"
module = "truewire.dev/examples/kraken"

[rust]
package = "kraken"
src = "src"
name = "Kraken"

[python.cores.root]
base = "kraken.core.base:KrakenBase"
children = { spot = "spot_client", streams = "private_client", trading_ws = "private_client" }

[python.cores.spot]
base = "kraken.core.endpoint.rpc:RpcEndpoint"

[python.cores.streams]
base = "kraken.core.base:StreamsBase"
# `StreamsBase.new(client, *, market_client)`: the root passes `private_client` as `client`
# (its `children` entry above) and its own `market_client` field for the keyword.
forward = ["market_client"]
children = { market_data = "market_client", private = "private_client" }

[python.cores.socket]
base = "kraken.core.endpoint.socket:SocketEndpoint"

# `spot.account.retrieve_export` answers with the raw export zip, not the JSON envelope, so
# its spec declares `surface: handwritten`: the TypeScript backend renders no method for it,
# and `spot/account/retrieve_export.ts` (hand-written) is folded into the generated router.
[[typescript.extras."spot.account"]]
file = "retrieve_export"
class = "RetrieveExport"
methods = ["retrieveExport"]
