[project]
name = "kraken"

[cores.spot]
# `signed` genuinely varies across spot's own 58 endpoints (46 signed, 12 public) --
# design §2/§6. `socket` (streams.market_data, streams.private, trading_ws -- 17
# endpoints, all meta: {}) carries no schema: `SocketEndpoint` reads nothing from
# `meta` at all -- the private/public split there is a connection-level fact
# (`[python.cores]` `children` routing), not a per-call one.
meta = { type = "object", properties = { signed = { type = "boolean" } }, additionalProperties = false }

[python]
package = "kraken"
src = "src"
name = "Kraken"

[python.cores.root]
base = "kraken.core.base:KrakenBase"
children = { spot = "spot_client", streams = "private_client", trading_ws = "private_client" }

[python.cores.spot]
base = "kraken.core.endpoint.rpc:RpcEndpoint"

[python.cores.streams]
base = "kraken.core.base:StreamsBase"
children = { market_data = "market_client", private = "private_client" }

[python.cores.socket]
base = "kraken.core.endpoint.socket:SocketEndpoint"
