// Reconstructed from typed_mexc betterproto2 classes (upstream: github.com/mexcdevelop/websocket-proto).
syntax = "proto3";

message PrivateAccountV3Api {
  string vcoin_name = 1;
  string coin_id = 2;
  string balance_amount = 3;
  string balance_amount_change = 4;
  string frozen_amount = 5;
  string frozen_amount_change = 6;
  string type = 7;
  int64 time = 8;
}

message PrivateDealsV3Api {
  string price = 1;
  string quantity = 2;
  string amount = 3;
  int32 trade_type = 4;
  bool is_maker = 5;
  bool is_self_trade = 6;
  string trade_id = 7;
  string client_order_id = 8;
  string order_id = 9;
  string fee_amount = 10;
  string fee_currency = 11;
  int64 time = 12;
}

message PrivateOrdersV3Api {
  string id = 1;
  string client_id = 2;
  string price = 3;
  string quantity = 4;
  string amount = 5;
  string avg_price = 6;
  int32 order_type = 7;
  int32 trade_type = 8;
  bool is_maker = 9;
  string remain_amount = 10;
  string remain_quantity = 11;
  optional string last_deal_quantity = 12;
  string cumulative_quantity = 13;
  string cumulative_amount = 14;
  int32 status = 15;
  int64 create_time = 16;
  optional string market = 17;
  optional int32 trigger_type = 18;
  optional string trigger_price = 19;
  optional int32 state = 20;
  optional string oco_id = 21;
  optional string route_factor = 22;
  optional string symbol_id = 23;
  optional string market_id = 24;
  optional string market_currency_id = 25;
  optional string currency_id = 26;
}

message PublicAggreBookTickerV3Api {
  string bid_price = 1;
  string bid_quantity = 2;
  string ask_price = 3;
  string ask_quantity = 4;
}

message PublicAggreDealsV3Api {
